name: Sync to Hugging Face Spaces

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  sync-to-hub:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Build assets-free deploy snapshot
        run: |
          rm -rf assets/videos assets/audios
          mkdir -p assets/videos assets/audios
          touch assets/videos/.gitkeep assets/audios/.gitkeep
          git checkout --orphan hf-deploy
          git add -A
          git -c user.email="actions@github.com" -c user.name="GitHub Actions" \
            commit -m "Deploy snapshot (assets excluded)"

      - name: Push to Hugging Face Space
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
        run: |
          git remote add space https://user:${HF_TOKEN}@huggingface.co/spaces/RohitMugalya/video-rag-agent
          git push --force space hf-deploy:main